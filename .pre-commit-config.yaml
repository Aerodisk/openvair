repos:
- repo: local
  hooks:
    - id: mypy-hook
      name: Custom mypy hook
      entry: bash .githooks/mypy
      language: system
      types: [python]
    - id: ruff-hook
      name: Custom ruff hook
      entry: bash .githooks/ruff
      language: system
      types: [python]
    - id: rde-spec-linter
      name: RDE Markdown specs
      entry: bash .githooks/rde-linter
      language: system
      files: ^specs/
      pass_filenames: false
