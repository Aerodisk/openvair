repos:
  - repo: local
    hooks:
      - id: mypy
        name: mypy (staged Python files)
        entry: .venv/bin/mypy
        language: system
        types: [python]
        exclude: ^(experiment/|requirements_linter/)
        args: [--config-file=mypy.ini]
      - id: ruff-hook
        name: Custom ruff hook
        entry: bash .githooks/ruff
        language: system
        types: [python]
        exclude: ^(experiment/|requirements_linter/)
      - id: rde-spec-linter
        name: RDE Markdown specs
        entry: python requirements_linter/lint_repo_specs.py
        language: python
        pass_filenames: false
        files: ^specs/
        additional_dependencies: [pyyaml]
